kind = "web"
previewPath = "/"
title = "SGI — Servicios Generales de Ingeniería"
version = "1.0.0"
id = "artifacts/sgi-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19040

[services.development]
run = "pnpm --filter @workspace/sgi-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sgi-landing", "run", "build" ]
publicDir = "artifacts/sgi-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19040"
BASE_PATH = "/"
