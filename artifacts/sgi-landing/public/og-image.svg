<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='630' viewBox='0 0 1200 630'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:#1a1a2e'/>
      <stop offset='60%' style='stop-color:#16213e'/>
      <stop offset='100%' style='stop-color:#7f1d1d'/>
    </linearGradient>
    <linearGradient id='accent' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' style='stop-color:#ef4444'/>
      <stop offset='100%' style='stop-color:#dc2626'/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width='1200' height='630' fill='url(#bg)'/>
  <!-- Grid lines decoration -->
  <line x1='0' y1='210' x2='1200' y2='210' stroke='white' stroke-width='0.4' opacity='0.08'/>
  <line x1='0' y1='420' x2='1200' y2='420' stroke='white' stroke-width='0.4' opacity='0.08'/>
  <line x1='400' y1='0' x2='400' y2='630' stroke='white' stroke-width='0.4' opacity='0.08'/>
  <line x1='800' y1='0' x2='800' y2='630' stroke='white' stroke-width='0.4' opacity='0.08'/>
  <!-- Red accent bar left -->
  <rect x='0' y='0' width='8' height='630' fill='url(#accent)'/>
  <!-- Red accent bar bottom -->
  <rect x='0' y='580' width='1200' height='8' fill='url(#accent)' opacity='0.6'/>
  <!-- Top label -->
  <rect x='60' y='60' width='220' height='36' rx='18' fill='#ef4444' opacity='0.15'/>
  <text x='80' y='84' font-family='Arial,sans-serif' font-size='14' font-weight='700' fill='#ef4444' letter-spacing='3'>● NOGALES · SONORA</text>
  <!-- Main title -->
  <text x='60' y='210' font-family='Arial Black,Arial,sans-serif' font-size='88' font-weight='900' fill='white' letter-spacing='-2'>SOLUCIONES</text>
  <text x='60' y='310' font-family='Arial Black,Arial,sans-serif' font-size='88' font-weight='900' fill='#ef4444' letter-spacing='-2'>INDUSTRIALES</text>
  <!-- Subtitle -->
  <text x='60' y='390' font-family='Arial,sans-serif' font-size='26' fill='#94a3b8' letter-spacing='1'>Mantenimiento · Moldeo · HVAC · Obra Civil</text>
  <!-- Company name -->
  <text x='60' y='530' font-family='Arial Black,Arial,sans-serif' font-size='32' font-weight='900' fill='white' letter-spacing='1'>SGI</text>
  <text x='126' y='530' font-family='Arial,sans-serif' font-size='22' fill='#64748b' letter-spacing='1'> Servicios Generales de Ingeniería</text>
  <!-- Phone -->
  <text x='60' y='568' font-family='Arial,sans-serif' font-size='18' fill='#ef4444'>+52 631 318 5564</text>
  <!-- Right side decorative elements -->
  <rect x='900' y='80' width='240' height='4' rx='2' fill='#ef4444' opacity='0.4'/>
  <rect x='940' y='100' width='200' height='4' rx='2' fill='#ef4444' opacity='0.2'/>
  <rect x='960' y='120' width='180' height='4' rx='2' fill='#ef4444' opacity='0.1'/>
  <!-- Service boxes right side -->
  <rect x='880' y='200' width='260' height='70' rx='8' fill='white' opacity='0.05'/>
  <text x='910' y='245' font-family='Arial,sans-serif' font-size='16' fill='white' opacity='0.8'>Mantenimiento Industrial</text>
  <rect x='880' y='290' width='260' height='70' rx='8' fill='white' opacity='0.05'/>
  <text x='910' y='335' font-family='Arial,sans-serif' font-size='16' fill='white' opacity='0.8'>Moldeo por Inyección</text>
  <rect x='880' y='380' width='260' height='70' rx='8' fill='white' opacity='0.05'/>
  <text x='910' y='425' font-family='Arial,sans-serif' font-size='16' fill='white' opacity='0.8'>Sistemas HVAC</text>
  <rect x='880' y='470' width='260' height='70' rx='8' fill='white' opacity='0.05'/>
  <text x='910' y='515' font-family='Arial,sans-serif' font-size='16' fill='white' opacity='0.8'>Obra Civil Industrial</text>
  <!-- 24/7 badge -->
  <circle cx='1130' cy='130' r='55' fill='#ef4444' opacity='0.15'/>
  <circle cx='1130' cy='130' r='50' fill='none' stroke='#ef4444' stroke-width='2' opacity='0.4'/>
  <text x='1130' y='122' font-family='Arial Black,Arial,sans-serif' font-size='22' font-weight='900' fill='white' text-anchor='middle'>24/7</text>
  <text x='1130' y='148' font-family='Arial,sans-serif' font-size='12' fill='#94a3b8' text-anchor='middle'>DISPONIBLES</text>
</svg>